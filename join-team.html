<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Our Team — Vedit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="logo-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="glass-nav fixed top-0 left-0 right-0 z-50">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2"><img src="logo-icon.png" alt="Vedit" class="h-8 w-8 object-contain"><span class="display text-xl font-bold">Ved<span class="gradient-text">it</span></span></a>
    <a href="index.html" class="btn btn-ghost btn-sm">&larr; Back home</a>
  </div>
</header>

<main class="max-w-2xl mx-auto px-6 pt-32 pb-24">
  <span class="timecode">TEAM APPLICATION</span>
  <h1 class="display text-3xl md:text-4xl font-bold mb-2">Join our team</h1>
  <p class="text-[--muted] mb-8">We're always looking for editors, designers and motion artists. Tell us about your work.</p>

  <form id="teamForm" class="card space-y-5">
    <div class="grid sm:grid-cols-2 gap-5">
      <div><label class="flabel">Full Name *</label><input required name="fullName" class="field"></div>
      <div><label class="flabel">Age *</label><input required type="number" min="14" max="100" name="age" class="field"></div>
    </div>
    <div class="grid sm:grid-cols-2 gap-5">
      <div><label class="flabel">Discord Username *</label><input required name="discordUsername" class="field"></div>
      <div><label class="flabel">Email *</label><input required type="email" name="email" class="field"></div>
    </div>
    <div>
      <label class="flabel">Country *</label>
      <input required name="country" class="field">
    </div>
    <div>
      <label class="flabel">Experience *</label>
      <textarea required name="experience" rows="3" class="field" placeholder="Years of experience, notable projects/clients..."></textarea>
    </div>
    <div>
      <label class="flabel">Portfolio *</label>
      <input required name="portfolio" class="field" placeholder="https://...">
    </div>
    <div>
      <label class="flabel">Specialization *</label>
      <select required name="specialization" class="field">
        <option value="">Select one</option>
        <option>Video Editor</option><option>Photo Editor</option><option>Thumbnail Designer</option><option>Motion Designer</option>
      </select>
    </div>
    <div>
      <label class="flabel">Availability *</label>
      <input required name="availability" class="field" placeholder="e.g. 20 hrs/week, evenings IST">
    </div>
    <div>
      <label class="flabel">Why should we hire you? *</label>
      <textarea required name="whyHireYou" rows="4" class="field"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary w-full">Submit Application</button>
    <div id="formResult" class="hidden"></div>
  </form>
</main>

<script src="api.js"></script>
<script src="main.js"></script>
<script>
  document.getElementById('teamForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const result = document.getElementById('formResult');
    const data = Object.fromEntries(new FormData(e.target).entries());
    setButtonLoading(btn, true, 'Submitting...');
    try {
      const res = await api.post('/applications/team', data);
      showFormResult(result, true, `Application submitted! Your Application ID is <span class="mono font-bold">${res.applicationId}</span>. Track it on the <a class="underline" href="status.html">Application Status</a> page.`);
      e.target.reset();
    } catch (err) {
      showFormResult(result, false, err.message || 'Something went wrong. Please try again.');
    } finally {
      setButtonLoading(btn, false, 'Submit Application');
    }
  });
</script>
</body>
</html>
