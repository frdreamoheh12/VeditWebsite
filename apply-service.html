<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Service — Vedit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="logo-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="glass-nav fixed top-0 left-0 right-0 z-50">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2"><img src="logo-icon.png" alt="Vedit" class="h-8 w-8 object-contain"><span class="display text-xl font-bold">Ved<span class="gradient-text">it</span></span></a>
    <a href="index.html" class="btn btn-ghost btn-sm">&larr; Back home</a>
  </div>
</header>

<main class="max-w-2xl mx-auto px-6 pt-32 pb-24">
  <span class="timecode">SERVICE REQUEST</span>
  <h1 class="display text-3xl md:text-4xl font-bold mb-2">Request an editing service</h1>
  <p class="text-[--muted] mb-8">Fill this out and we'll get back to you within 24 hours with a scope and quote.</p>

  <form id="serviceForm" class="card space-y-5">
    <div>
      <label class="flabel">Full Name *</label>
      <input required name="fullName" class="field" placeholder="Your full name">
    </div>
    <div class="grid sm:grid-cols-2 gap-5">
      <div><label class="flabel">Email *</label><input required type="email" name="email" class="field" placeholder="you@email.com"></div>
      <div><label class="flabel">Discord Username *</label><input required name="discordUsername" class="field" placeholder="username"></div>
    </div>
    <div>
      <label class="flabel">Country *</label>
      <input required name="country" class="field" placeholder="e.g. India">
    </div>
    <div>
      <label class="flabel">Project Type *</label>
      <select required name="projectType" class="field">
        <option value="">Select one</option>
        <option>Video</option>
        <option>Photo</option>
      </select>
    </div>
    <div>
      <label class="flabel">Service</label>
      <select name="service" id="serviceSelect" class="field">
        <option value="">Select a service</option>
        <option>Video Editing</option><option>Photo Editing</option><option>YouTube Editing</option>
        <option>Shorts & Reels Editing</option><option>Thumbnail Design</option><option>Motion Graphics</option><option>Color Grading</option>
      </select>
    </div>
    <div>
      <label class="flabel">Project Description *</label>
      <textarea required name="projectDescription" rows="4" class="field" placeholder="Tell us about the project..."></textarea>
    </div>
    <div class="grid sm:grid-cols-2 gap-5">
      <div><label class="flabel">Deadline *</label><input required type="date" name="deadline" class="field"></div>
      <div><label class="flabel">Budget *</label><input required name="budget" class="field" placeholder="e.g. ₹1500"></div>
    </div>
    <div>
      <label class="flabel">Google Drive Link (optional)</label>
      <input name="driveLink" class="field" placeholder="https://drive.google.com/...">
    </div>
    <div>
      <label class="flabel">Reference Link (optional)</label>
      <input name="referenceLink" class="field" placeholder="https://youtube.com/...">
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary w-full">Submit Request</button>
    <div id="formResult" class="hidden"></div>
  </form>
</main>

<script src="api.js"></script>
<script src="main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const svc = params.get('service');
  if (svc) document.getElementById('serviceSelect').value = svc;

  document.getElementById('serviceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const result = document.getElementById('formResult');
    const data = Object.fromEntries(new FormData(e.target).entries());
    setButtonLoading(btn, true, 'Submitting...');
    try {
      const res = await api.post('/applications/service', data);
      showFormResult(result, true, `Request submitted! Your Application ID is <span class="mono font-bold">${res.applicationId}</span>. Save it to track your status on the <a class="underline" href="status.html">Application Status</a> page.`);
      e.target.reset();
    } catch (err) {
      showFormResult(result, false, err.message || 'Something went wrong. Please try again.');
    } finally {
      setButtonLoading(btn, false, 'Submit Request');
    }
  });
</script>
</body>
</html>
